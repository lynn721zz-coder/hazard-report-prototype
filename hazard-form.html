<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐患填写表单</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background:#e8f0fd;
    display:flex; justify-content:center;
    min-height:100vh;
  }
  .phone {
    width:375px; max-width:100vw; min-height:100vh;
    background:linear-gradient(180deg,#e8f0fd 0%,#f3f7fe 100%);
    position:relative;
    padding-bottom:96px;
  }
  /* ===== 顶部导航 ===== */
  .nav {
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 16px;
    margin-bottom:12px;
    background:#fff;
    position:sticky; top:0; z-index:15;
  }
  .nav-btn {
    width:44px; height:44px; border-radius:12px;
    background:#f1f5fb; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .nav-text { flex:1; }
  .nav-title { font-size:18px; font-weight:700; color:#1f2a44; }
  .nav-status { font-size:12.5px; color:#8a96ad; margin-top:3px; }

  /* ===== 通用卡片 ===== */
  .card {
    background:#fff; border-radius:16px;
    margin:0 12px 12px; padding:16px;
    box-shadow:0 1px 4px rgba(31,58,110,.05);
  }
  .sec-head { display:flex; align-items:center; gap:7px; margin-bottom:12px; }
  .sec-head svg { flex:none; }
  .sec-head .t { font-size:16px; font-weight:700; color:#1f2a44; }
  .req { color:#ef4444; font-weight:400; }

  /* ===== 照片上传 ===== */
  .upload-area {
    border:1.5px dashed #b9c8e2; border-radius:12px;
    background:#f6f9fe;
    padding:26px 0 22px;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    cursor:pointer;
  }
  .upload-area .u-t { font-size:14px; color:#3d4a63; font-weight:500; }
  .upload-area .u-s { font-size:11.5px; color:#9aa8bb; }
  .uploaded { display:flex; gap:10px; flex-wrap:wrap; }
  .thumb {
    width:112px; border-radius:10px; overflow:hidden;
    position:relative; line-height:0;
    box-shadow:0 1px 4px rgba(31,58,110,.12);
  }
  .thumb svg { width:100%; height:auto; display:block; }
  .thumb .del {
    position:absolute; top:5px; right:5px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(15,23,42,.55); color:#fff;
    font-size:13px; display:flex; align-items:center; justify-content:center;
    line-height:1; cursor:pointer;
  }
  .add-cell {
    width:112px; height:76px;
    border:1.5px dashed #c3cfe2; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:#9aa8bb; font-size:11px; cursor:pointer;
  }
  .photo-name {
    display:flex; align-items:center; justify-content:center; gap:5px;
    margin-top:12px; font-size:12.5px; color:#8a96ad;
  }

  /* ===== 表单字段 ===== */
  .f-label { font-size:13.5px; color:#3d4a63; font-weight:500; margin-bottom:8px; }
  .f-textarea {
    width:100%; height:76px; resize:none;
    border:1px solid #e3eaf4; border-radius:10px;
    background:#f8fafd; padding:10px 12px;
    font-size:13.5px; color:#1f2a44; line-height:1.6;
    font-family:inherit; outline:none;
  }
  .f-textarea::placeholder { color:#a8b3c7; }
  .f-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 2px; border-bottom:1px solid #f0f4fa;
  }
  .f-row:last-child { border-bottom:none; }
  .f-row .k { font-size:13.5px; color:#6b7896; }
  .f-row .v { font-size:13.5px; color:#1f2a44; display:flex; align-items:center; gap:4px; }
  .f-row .arrow { color:#b6c2d6; font-size:14px; }

  /* ===== 底部操作栏 ===== */
  .bar-fix {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:375px; max-width:100vw;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:#fff;
    box-shadow:0 -2px 12px rgba(31,58,110,.06);
    display:flex; z-index:20;
  }
  .btn-ai {
    flex:1; height:48px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#4d8bff,#2f6df6);
    color:#fff; font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(47,109,246,.3);
  }
  .btn-ai.loading { opacity:.75; pointer-events:none; }
  .spin {
    width:17px; height:17px; flex:none;
    border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
    border-radius:50%; animation:sp .8s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ===== toast ===== */
  #toast {
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:rgba(15,23,42,.82); color:#fff;
    font-size:13px; padding:9px 16px; border-radius:20px;
    display:none; z-index:99; white-space:nowrap;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- 顶部导航 -->
  <div class="nav">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#1f2a44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="nav-text">

  <!-- 现场照片（必填） -->

        <!-- 地面 -->
        <rect x="0" y="300" width="640" height="120" fill="#8e9bb0" data-page-node-id="R3kHCpBocjfBEFSqBLGrGg"/>
        <rect x="0" y="300" width="640" height="14" fill="#7c8aa0" data-page-node-id="4ZdezFXLbj39WBB7XN8ok8"/>
        <!-- 黄黑警示条纹立柱 -->
        <g data-page-node-id="AHfXqp6NXHYWnRFFBQs4g1">
          <rect x="470" y="180" width="26" height="180" fill="#e8c34a" data-page-node-id="S4Ypk4PmEheHuUK4Olod6l"/>
          <rect x="470" y="180" width="26" height="16" fill="#2b2f38" transform="skewX(-18)" data-page-node-id="PKdhlNORCGUHV2aB991BAP" />
          <path d="M470 200 l26 -14 v18 l-26 14 z" fill="#2b2f38" data-page-node-id="Ru0LXQ88FiwfuSnsuxXyDd"/>
          <path d="M470 240 l26 -14 v18 l-26 14 z" fill="#2b2f38" data-page-node-id="c2T4wEf1z1pgkKGey2wSCO"/>
          <path d="M470 280 l26 -14 v18 l-26 14 z" fill="#2b2f38" data-page-node-id="uHex0n04eoV4cwwxeiuBWY"/>
          <path d="M470 320 l26 -14 v18 l-26 14 z" fill="#2b2f38" data-page-node-id="kQMrhIvdt6mcoa6gB5cRhM"/>
        </g>
        <!-- 主管道（横） -->
        <rect x="0" y="196" width="640" height="58" rx="8" fill="#d7dde6" data-page-node-id="lBdhWkojeUjoYqBd7i5jf5"/>
        <rect x="0" y="196" width="640" height="16" fill="#eceff4" data-page-node-id="gD3zdpcazG5u0GBT2gbHZt"/>
        <!-- 法兰盘 -->
        <rect x="120" y="188" width="22" height="74" rx="4" fill="#b7c1cf" data-page-node-id="SAmDPFg3VG2pMkLSijCifJ"/>
        <rect x="300" y="188" width="22" height="74" rx="4" fill="#b7c1cf" data-page-node-id="LJWDMyjf691smN8HGNU1SH"/>
        <!-- 蓝色阀门主体 -->
        <rect x="216" y="150" width="110" height="150" rx="14" fill="#3b6fd4" data-page-node-id="8AV0LtR5sDz8I2RGtWnNjB"/>

        <!-- 阀门红色手轮（顶部） -->
        <ellipse cx="271" cy="140" rx="64" ry="26" fill="#d9363e" data-page-node-id="FPdTknuc590JgouCklDABe"/>

        <div class="del" onclick="event.stopPropagation(); removePhoto()">×</div>

    <div class="photo-name" id="photoName" style="display:none">

  <!-- 隐患描述 -->

    <div class="f-label">隐患描述</div>
    <textarea class="f-textarea" placeholder="可简单描述隐患情况，上传照片后可点击下方按钮由 AI 自动识别生成"></textarea>

  <!-- 基本信息 -->

    <div class="f-row">
      <span class="k">隐患部位</span>
      <span class="v" onclick="toast('演示环境：部位选择略')">管廊作业区 <span class="arrow">›</span></span>
    </div>

      <span class="k">发现时间</span>
      <span class="v">2026-11-02 14:30</span>

  <!-- 底部操作栏 -->

  <div id="toast"></div>

<script>
// ============ 隐患填写表单：流程第 1 步（上传图片 → 点击 AI识隐患） ============
let photoUploaded = false;
let toastTimer;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.style.display='none', 1800);
}

// 上传照片（演示：点击即模拟从相册选择成功）
function uploadPhoto(){
  photoUploaded = true;
  document.getElementById('uploadArea').style.display = 'none';
  document.getElementById('uploadedGrid').style.display = 'flex';
  document.getElementById('photoName').style.display = 'flex';
  // 埋点：hse_form_photo_upload（count=1）
  toast('照片上传成功');
}

function removePhoto(){
  photoUploaded = false;
  document.getElementById('uploadArea').style.display = 'flex';
  document.getElementById('uploadedGrid').style.display = 'none';
  document.getElementById('photoName').style.display = 'none';
}

function goBack(){ history.back(); }

// 点击 AI识隐患：未上传提示；已上传 loading 后跳转识别结果页
function onAiRecognize(){
  if(!photoUploaded){ toast('请先上传隐患照片'); return; }
  const btn = document.getElementById('aiBtn');
  btn.classList.add('loading');
  document.getElementById('aiIcon').outerHTML = '<span class="spin" id="aiIcon"></span>';
  document.getElementById('aiBtnTxt').textContent = '正在识别隐患…';
  // 埋点：hse_ai_recognize_click（has_photo=1）
  // 跳转 AI识隐患结果页；加时间戳防 bfcache
  setTimeout(function(){
    location.href = 'ai-hazard-recognition.html?src=form&t=' + Date.now();
  }, 1400);
}
</script>

</html>
