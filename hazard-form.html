<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐患登记</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background:#fff;
    display:flex; justify-content:center;
    min-height:100vh;
  }
  .phone {
    width:375px; max-width:100vw; min-height:100vh;
    background:#fff;
    position:relative;
    padding-bottom:88px;
  }
  /* ===== 顶部导航 ===== */
  .nav {
    display:flex; align-items:center; gap:10px;
    padding:14px 14px 12px;
    background:#fff;
    position:sticky; top:0; z-index:15;
    border-bottom:0.5px solid #f0f2f5;
  }
  .nav-btn {
    width:34px; height:34px; border:none; background:none;
    display:flex; align-items:center; justify-content:center;
    flex:none; cursor:pointer;
  }
  .nav-title {
    flex:1; text-align:center;
    font-size:17.5px; font-weight:600; color:#1f2329;
    margin-right:34px; /* 平衡返回键宽度，标题居中 */
  }

  /* ===== 流程步骤条 ===== */
  .steps-grid {
    display:grid; grid-template-columns:repeat(5, 1fr);
    padding:20px 14px 4px;
  }
  .sg-cell { display:flex; flex-direction:column; align-items:center; gap:9px; position:relative; }
  .sg-cell .dot {
    width:22px; height:22px; border-radius:50%;
    background:#c6d4f0; z-index:2;
  }
  .sg-cell.active .dot {
    background:#1d4fd7;
    box-shadow:0 0 0 4.5px rgba(29,79,215,.18);
    position:relative;
  }
  .sg-cell.active .dot::after {
    content:''; position:absolute; inset:6.5px; border-radius:50%; background:#fff;
  }
  .sg-cell .lab { font-size:13.5px; color:#8a94a6; }
  .sg-cell.active .lab { color:#1d4fd7; font-weight:600; }
  .sg-cell:not(:last-child)::before {
    content:''; position:absolute; top:10px; left:calc(50% + 13px);
    width:calc(100% - 26px); height:3px;
    background:#c6d4f0; border-radius:2px; z-index:1;
  }

  /* ===== 表单行 ===== */
  .form-rows { padding:6px 16px 0; }
  .frow { border-bottom:0.5px solid #eceff3; padding:15px 0 13px; }
  .frow:last-child { border-bottom:none; }
  .fhead { display:flex; align-items:baseline; }
  .flabel {
    width:88px; flex:none;
    font-size:15.5px; color:#1f2329; font-weight:500;
    line-height:1.5;
  }
  .flabel .req { color:#e5484d; margin-right:1px; }
  .fvalue { flex:1; }
  .finput {
    width:100%; border:none; outline:none;
    font-size:15px; color:#1f2329;
    font-family:inherit;
    background:transparent;
    line-height:1.5;
  }
  .finput::placeholder { color:#b3bccb; }
  textarea.finput { resize:none; height:66px; display:block; }
  .counter { text-align:right; font-size:12.5px; color:#b3bccb; margin-top:2px; }

  /* 单选组 */
  .radio-group { display:flex; flex-wrap:wrap; gap:10px 0; }
  .radio-item { width:50%; display:flex; align-items:center; gap:8px; font-size:15px; color:#1f2329; cursor:pointer; }
  .radio-item .rc {
    width:17px; height:17px; border-radius:50%; flex:none;
    border:1.5px solid #c3ccd9; position:relative; background:#fff;
  }
  .radio-item.on .rc { border-color:#1d4fd7; }
  .radio-item.on .rc::after {
    content:''; position:absolute; inset:3.5px; border-radius:50%; background:#1d4fd7;
  }
  .radio-item .other-input {
    border:none; outline:none; background:transparent;
    font-size:14.5px; color:#1f2329; width:96px;
    border-bottom:0.5px solid #dfe3ea;
    font-family:inherit;
  }
  .radio-item .other-input::placeholder { color:#b3bccb; }

  /* 发现时间行 */
  .sel-row { display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  .sel-row .sel-txt { flex:1; font-size:15px; color:#b3bccb; }
  .sel-row .sel-txt.filled { color:#1f2329; }
  .sel-row .arr { color:#c3ccd9; font-size:15px; }

  /* ===== 现场照片区 ===== */
  .photo-area { display:flex; gap:14px; align-items:flex-start; }
  .photo-left { flex:none; }
  .btn-ai {
    display:inline-flex; align-items:center; gap:5px;
    background:#1d4fd7; color:#fff;
    border:none; border-radius:5px;
    font-size:12.5px; font-weight:500;
    padding:7px 11px; cursor:pointer;
    font-family:inherit;
  }
  .btn-ai.loading { opacity:.75; pointer-events:none; }
  .photo-right { flex:1; display:flex; flex-wrap:wrap; gap:10px; }
  .upload-cell {
    width:88px; height:88px;
    border:1.2px dashed #c9d2e0; border-radius:6px;
    background:#fafbfd;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .thumb {
    width:88px; height:88px; border-radius:6px; overflow:hidden;
    position:relative; line-height:0;
  }
  .thumb svg { width:100%; height:100%; display:block; }
  .thumb .del {
    position:absolute; top:3px; right:3px;
    width:19px; height:19px; border-radius:50%;
    background:rgba(15,23,42,.55); color:#fff;
    font-size:12px; display:flex; align-items:center; justify-content:center;
    line-height:1; cursor:pointer;
  }

  /* ===== 底部操作栏 ===== */
  .bar-fix {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:375px; max-width:100vw;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:#fff;
    border-top:0.5px solid #eceff3;
    display:flex; gap:12px; z-index:20;
  }
  .btn-draft, .btn-submit {
    flex:1; height:44px; border:none; border-radius:8px;
    font-size:16px; font-weight:500; cursor:pointer;
    font-family:inherit;
  }
  .btn-draft { background:#f2f3f5; color:#1f2329; }
  .btn-submit { background:#1d4fd7; color:#fff; }
  .spin {
    width:14px; height:14px; flex:none; display:inline-block; vertical-align:-2px;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:sp .8s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* ===== 补充说明（选填）===== */
  .prompt-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    border:1px solid #dfe3ea; border-radius:14px;
    background:#fff; padding:5px 12px;
    font-size:12.5px; color:#3d4a63;
    cursor:pointer; transition:all .15s;
  }
  .chip.on {
    background:#e8effd; border-color:#1d4fd7; color:#1d4fd7; font-weight:500;
  }
  .prompt-box { position:relative; margin-top:10px; }
  .prompt-textarea {
    width:100%; height:58px; resize:none;
    border:1px solid #e3eaf4; border-radius:8px;
    background:#f8fafd; padding:9px 34px 9px 11px;
    font-size:13.5px; color:#1f2329; line-height:1.55;
    font-family:inherit; outline:none;
  }
  .prompt-textarea:focus { border-color:#1d4fd7; background:#f3f7ff; }
  .prompt-textarea::placeholder { color:#b3bccb; }
  .mic-btn {
    position:absolute; right:7px; top:8px;
    width:26px; height:26px; border:none; border-radius:50%;
    background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .prompt-counter { text-align:right; font-size:12px; color:#b3bccb; margin-top:3px; }
  .prompt-hint { font-size:11.5px; color:#9aa8bb; margin-top:7px; line-height:1.5; }

  /* ===== toast ===== */
  #toast {
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:rgba(15,23,42,.82); color:#fff;
    font-size:13px; padding:9px 16px; border-radius:20px;
    display:none; z-index:99; white-space:nowrap;
  }
</style>
</head>

        <div class="radio-item" data-v="包保履职" onclick="pickType(this)"><span class="rc"></span>包保履职</div>

      </div>
    </div>

    <!-- 发现时间（必填） -->

      <div class="fhead">
        <span class="flabel"><span class="req">*</span>发现时间</span>

    <!-- 隐患描述 -->
    <div class="frow">

      <div class="fvalue">
        <textarea class="finput" id="descInput" maxlength="500" placeholder="请输入内容" oninput="updCount('descInput','descCnt')"></textarea>
        <div class="counter"><span id="descCnt">0</span>/500</div>
      </div>
    </div>

    <!-- 检查依据 -->
    <div class="frow">
      <div class="fhead"><span class="flabel">检查依据</span></div>
      <div class="fvalue">
        <textarea class="finput" id="basisInput" maxlength="500" placeholder="请输入内容" oninput="updCount('basisInput','basisCnt')"></textarea>
        <div class="counter"><span id="basisCnt">0</span>/500</div>
      </div>
    </div>

    <!-- 整改措施 -->
    <div class="frow">
      <div class="fhead"><span class="flabel">整改措施</span></div>
      <div class="fvalue">
        <textarea class="finput" id="measureInput" maxlength="500" placeholder="请输入内容" oninput="updCount('measureInput','measureCnt')"></textarea>
        <div class="counter"><span id="measureCnt">0</span>/500</div>
      </div>
    </div>

    <!-- 补充说明（选填）：图主文辅，识别时作为上下文注入 -->
    <div class="frow">
      <div class="fhead" style="align-items:flex-start">
        <span class="flabel" style="width:88px">补充说明<span style="font-weight:400;font-size:12px;color:#9aa8bb">（选填）</span></span>
        <div class="fvalue">
          <div class="prompt-chips" id="promptChips">
            <span class="chip" data-t="动火作业" onclick="toggleChip(this)">动火作业</span>
            <span class="chip" data-t="高处作业" onclick="toggleChip(this)">高处作业</span>
            <span class="chip" data-t="用电安全" onclick="toggleChip(this)">用电安全</span>
            <span class="chip" data-t="消防通道" onclick="toggleChip(this)">消防通道</span>
            <span class="chip" data-t="有限空间" onclick="toggleChip(this)">有限空间</span>
          </div>
          <div class="prompt-box">
            <textarea class="prompt-textarea" id="promptText" maxlength="100" placeholder="如：今天有雨，重点看脚手架…" oninput="updPromptCnt()"></textarea>

              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#1d4fd7" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke="#1d4fd7" stroke-width="1.8" stroke-linecap="round"/><path d="M12 17.5V21" stroke="#1d4fd7" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="prompt-counter"><span id="promptCnt">0</span>/100</div>
          <div class="prompt-hint">可点选上方标签或输入文字，AI 将结合补充说明识别隐患（以图片为准）</div>

<script>
// ============ 隐患登记表单：流程第 1 步（填表 + 上传图片 → 点击 AI识隐患） ============
let photoUploaded = false;
let toastTimer;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.style.display='none', 1800);
}

function pickType(el){
  document.querySelectorAll('#typeGroup .radio-item').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  // 埋点：hse_form_field_change（字段=检查类型，值=所选项）
}

function pickTime(){
  // 演示：直接填入当前时间（真实环境为日期时间选择器）
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  const txt = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  const t = document.getElementById('timeTxt');
  t.textContent = txt; t.classList.add('filled');
}

function updCount(inputId, cntId){
  document.getElementById(cntId).textContent = document.getElementById(inputId).value.length;
}

// 上传照片（演示：点击即模拟从相册选择成功）
// 埋点：hse_form_photo_upload（count=1）
function uploadPhoto(){
  photoUploaded = true;
  document.getElementById('uploadCell').style.display = 'none';
  document.getElementById('thumbCell').style.display = 'block';
  toast('照片上传成功');
}

function removePhoto(){
  photoUploaded = false;
  document.getElementById('uploadCell').style.display = 'flex';
  document.getElementById('thumbCell').style.display = 'none';
}

// 点击 AI识隐患：未上传提示；已上传 loading 后跳转 AI识隐患结果页
// 埋点：hse_ai_recognize_click（has_photo=1）
function onAiRecognize(){
  if(!photoUploaded){ toast('请先上传隐患照片'); return; }
  collectPrompt();   // 补充说明随跳转传递（sessionStorage）
  const btn = document.getElementById('aiBtn');
  btn.classList.add('loading');
  document.getElementById('aiBtnTxt').innerHTML = '<span class="spin"></span> 识别中…';
  setTimeout(function(){
    // 加时间戳防 bfcache，确保每次点击都重放后续等待效果
    location.href = 'ai-hazard-recognition.html?src=form&t=' + Date.now();
  }, 1400);
}

function onSubmit(){
  if(!photoUploaded){ toast('请先上传隐患照片'); return; }
  toast('演示环境：提交成功');
}

// ============ 补充说明（选填）：快捷标签 + 自由文本 + 语音 ============
function toggleChip(el){
  el.classList.toggle('on');
  // 埋点：hse_prompt_tag_click（tag=el.dataset.t, on=选中/取消）
}

function updPromptCnt(){
  document.getElementById('promptCnt').textContent = document.getElementById('promptText').value.length;
}

// 语音输入（演示：模拟语音转文字填入示例语句；真实环境接入 ASR）
function voiceInput(){
  const ta = document.getElementById('promptText');
  if(ta.value.length >= 90){ toast('已达 100 字上限'); return; }
  ta.value = (ta.value ? ta.value + '，' : '') + '现场正在进行动火作业';
  updPromptCnt();
  toast('语音识别完成');
  // 埋点：hse_prompt_voice_used
}

// 收集补充说明：选中标签 + 自由文本；无内容则清除
function collectPrompt(){
  const tags = Array.prototype.map.call(
    document.querySelectorAll('#promptChips .chip.on'), c => c.dataset.t);
  const text = document.getElementById('promptText').value.trim();
  if(tags.length === 0 && !text){ sessionStorage.removeItem('hazardPrompt'); return null; }
  const p = { tags: tags, text: text };
  sessionStorage.setItem('hazardPrompt', JSON.stringify(p));
  // 埋点：hse_prompt_usage（tag_count=tags.length, has_text=!!text）
  return p;
}
</script>
</body>
