  }

    position:relative;
    padding-bottom:96px;
  }
  /* ===== 顶部导航 ===== */
  .nav {
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 12px;
    background:#fff;
    position:sticky; top:0; z-index:15;
  }
  .nav-btn {
    width:44px; height:44px; border-radius:12px;
    background:#f1f5fb; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .nav-icon-wrap { position:relative; }
  .nav-icon-wrap .green-dot {
    position:absolute; top:6px; right:6px;
    width:8px; height:8px; border-radius:50%;
    background:#22c55e; border:1.5px solid #fff;
  }
  .nav-text { flex:1; }
  .nav-title { font-size:18px; font-weight:700; color:#1f2a44; }
  .nav-status { display:flex; align-items:center; gap:5px; margin-top:3px; }
  .nav-status .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; }
  .nav-status span { font-size:12.5px; color:#8a96ad; }

  /* ===== 通用卡片 ===== */
  .card {
    background:#fff; border-radius:16px;
    margin:0 12px 12px; padding:16px;
    box-shadow:0 1px 4px rgba(31,58,110,.05);
  }
  .sec-head { display:flex; align-items:center; gap:7px; margin-bottom:12px; }
  .sec-head svg { flex:none; }
  .sec-head .t { font-size:16px; font-weight:700; color:#1f2a44; }

  /* ===== 现场照片 ===== */
  .photo-wrap {
    border-radius:12px; overflow:hidden;
    background:#dfe5ee; line-height:0;
  }
  .photo-wrap svg { width:100%; height:auto; display:block; }
  .photo-name {
    display:flex; align-items:center; justify-content:center; gap:5px;
    margin-top:12px; font-size:12.5px; color:#8a96ad;
  }

  /* ===== AI 提示卡 ===== */
  .ai-card { display:flex; align-items:center; gap:12px; }
  .ai-icon {
    width:46px; height:46px; border-radius:12px; flex:none;
    background:linear-gradient(135deg,#4d8bff,#2f6df6);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(47,109,246,.28);
  }
  .ai-title { font-size:16.5px; font-weight:700; color:#1f2a44; }
  .ai-sub { font-size:12.5px; color:#8a96ad; margin-top:4px; }

  /* ===== 深度分析行 ===== */
  .depth-row {
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .depth-row .l { font-size:14.5px; color:#3d4a63; font-weight:500; }
  .depth-row .r { display:flex; align-items:center; gap:2px; font-size:13px; color:#8a96ad; }
  .depth-detail {
    display:none; margin-top:12px; padding-top:12px;
    border-top:1px dashed #e3e9f2;
    font-size:12.5px; color:#6b7896; line-height:1.9;
  }
  .depth-detail.open { display:block; }
  .depth-detail b { color:#2f6df6; font-weight:600; }

  /* ===== 隐患描述卡片 ===== */
  .hazard-card {
    background:#fff; border-radius:16px;
    margin:0 12px 12px; padding:16px;
    border:1.5px solid transparent;
    box-shadow:0 1px 4px rgba(31,58,110,.05);
    position:relative; overflow:hidden;
    cursor:pointer; transition:border-color .15s;
  }
  .hazard-card.selected { border-color:#2f6df6; }
  .hz-head { display:flex; align-items:flex-start; gap:10px; padding-right:26px; }
  .hz-warn {
    width:38px; height:38px; border-radius:10px; flex:none;
    background:#fff7e8;
    display:flex; align-items:center; justify-content:center;
  }
  .hz-title { font-size:16px; font-weight:700; color:#2f6df6; margin-top:2px; }
  .hz-desc { font-size:13.5px; color:#55617a; line-height:1.65; margin-top:9px; }
  /* 选中角标 */
  .corner-check {
    position:absolute; top:0; right:0;
    width:34px; height:34px;
    display:none;
  }
  .hazard-card.selected .corner-check { display:block; }
  .hz-foot {
    display:flex; align-items:center; gap:6px; margin-top:14px;
    font-size:13px; color:#2f6df6; font-weight:600;
    visibility:hidden;
  }
  .hazard-card.selected .hz-foot { visibility:visible; }

  /* ===== 底部操作栏 ===== */
  .bottom-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:375px; max-width:100vw;
    background:#fff; border-radius:20px 20px 0 0;
    box-shadow:0 -4px 16px rgba(31,58,110,.08);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .sel-info { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .sel-info .txt { font-size:14px; font-weight:600; color:#1f2a44; }
  .btn-row { display:flex; gap:12px; }
  .btn {
    flex:1; height:50px; border:none; border-radius:14px;
    font-size:16px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:all .15s;
  }
  .btn-cancel { background:#eef1f6; color:#55617a; }
  .btn-cancel:active { background:#e2e7ef; }
  .btn-primary {
    flex:1.4;
    background:linear-gradient(90deg,#3d82ff,#2f6df6);
    color:#fff;
    box-shadow:0 4px 12px rgba(47,109,246,.3);
  }
  .btn-primary:active { opacity:.9; }
  .btn-primary.disabled {
    background:#c6d4ec; box-shadow:none; cursor:not-allowed;
  }

  /* ===== toast ===== */
  .toast {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(23,32,54,.85); color:#fff;
    padding:10px 18px; border-radius:10px;
    font-size:13.5px; z-index:99; display:none;
    pointer-events:none; max-width:80vw; text-align:center;
  }
</style>

    </div>

  <div class="toast" id="toast" data-page-node-id="s937hopSMLpcKtCwm0FOts"></div>
</div>

<script>
// ============ 隐患数据 ============
const hazards = [
  {
    id: 'item_001',
    title: '现场无防护设施',
    desc: '作业区域未设置任何安全防护设施，存在人员坠落或物体打击风险。'
  },
  {
    id: 'item_002',
    title: '人员未佩戴防护用品',
    desc: '现场作业人员未佩戴安全帽、安全带等必要防护用品，违反安全操作规程。'
  }
];

let selectedId = 'item_001';   // 默认选中第一条（与截图一致）

// ============ 渲染 ============
const CHECK_BLUE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#2f6df6"/><path d="M8 12.3l2.6 2.6 5-5.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WARN_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3.5L21.5 20h-19L12 3.5z" stroke="#f5a623" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.2" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.1" fill="#f5a623"/></svg>';

function render(){
  const wrap = document.getElementById('hazardList');
  wrap.innerHTML = hazards.map(h=>{
    const sel = h.id === selectedId;
    return `
    <div class="hazard-card ${sel?'selected':''}" onclick="selectHazard('${h.id}')">
      <!-- 右上角选中角标 -->
      <svg class="corner-check" viewBox="0 0 34 34"><path d="M0 0h34v34z" fill="#2f6df6" transform="translate(0,0)"/><path d="M34 0 L34 34 L0 0 Z" fill="#2f6df6"/><path d="M20.5 7.5 l3 3 5-5.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 24 7)"/></svg>
      <div class="hz-head">
        <div class="hz-warn">${WARN_ICON}</div>
        <div style="flex:1">
          <div class="hz-title">${h.title}</div>
          <div class="hz-desc">${h.desc}</div>
        </div>
      </div>
      <div class="hz-foot">${CHECK_BLUE} 已选择</div>
    </div>`;
  }).join('');

  const has = !!selectedId;
  document.getElementById('selCount').textContent = has ? '已选择 1 项' : '未选择隐患';
  const btn = document.getElementById('analyzeBtn');
  btn.classList.toggle('disabled', !has);
}

// ============ 交互 ============
function selectHazard(id){
  selectedId = (selectedId === id) ? null : id;   // 点击已选中的可取消
  render();
  // 埋点：hse_agent_recognition_item_toggle（action=select/unselect）
}

function onCancel(){
  if(!selectedId){ history.back(); return; }
  selectedId = null;
  render();
  toast('已取消选择');
}

function onAnalyze(){
  if(!selectedId){ toast('请先选择一条隐患'); return; }
  const h = hazards.find(x=>x.id===selectedId);
  // 埋点：hse_agent_assist_click（has_selection=selected, selected_item_ids=[selectedId]）
  // 跳转隐患分析结果页（同目录存在则跳转，否则提示）
  const target = 'hazard-analysis-result.html';
  fetch(target, {method:'HEAD'}).then(r=>{
    if(r.ok) location.href = target + '?item=' + encodeURIComponent(selectedId);
    else toast('演示环境：即将进入「隐患分析结果」（'+h.title+'）');
  }).catch(()=> toast('演示环境：即将进入「隐患分析结果」（'+h.title+'）'));
}

function goBack(){ history.back(); }

function toggleDepth(){
  const d = document.getElementById('depthDetail');
  const open = d.classList.toggle('open');
  document.getElementById('depthTxt').textContent = open ? '收起' : '展开';
  document.getElementById('depthArrow').style.transform = open ? 'rotate(90deg)' : '';
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.style.display='none', 1800);
}

render();
</script>
</body>
</html>
